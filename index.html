<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CADASTRO DE PRODUTOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>CADASTRO DE PRODUTOS</h1>

        <p class="subtitulo">Cadastrando os Produtos</p>
        
        <form id="produto-form">

            <label for="nome">Nome do Produto:</label>

            <div class="campo-nome">

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome do produto"
                    autocomplete="off"
                >

                <div id="sugestoes-produtos"></div>

            </div>

            <label for="preco">Preço Unitário:</label>
            <input type="number" id="preco" step="0.01" placeholder="Digite o preço">

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" placeholder="Digite a quantidade">

            <!-- NOVO: Mensagem de erro inline -->
            <div id="mensagem-erro"></div>

            <button type="submit" class="btn-primary">
                Adicionar Produto
            </button>

        </form>

        <div class="resumo">
            <h2>Total em Estoque</h2>
            <p id="total-estoque">R$ 0,00</p>
        </div>

        <h2>Produtos Cadastrados</h2>

        <div class="grupo-busca">

            <label for="campo-busca">Pesquisar Produto:</label>

            <input
                type="text"
                id="campo-busca"
                placeholder="Digite o nome do produto..."
            >

        </div>

        <table id="tabela-produtos">

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço Un.</th>
                    <th>Qtd.</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>
            </tbody>

        </table>

        <button id="limpar-tabela" class="btn-limpar">
            Limpar Estoque
        </button>

        <div class="foto-rodape">

            <img src="minha-foto.jpg" alt="Foto do desenvolvedor">

        </div>

    </div>

    <!-- NOVO: Modal de confirmação e conceito Bootstrap -->
    <div id="modal-fundo" class="modal-fundo">

        <div class="modal-conteudo">

            <h2 id="modal-titulo">Confirmar ação</h2>

            <p id="modal-mensagem">
                Deseja realmente continuar?
            </p>

            <div class="modal-botoes">

                <button type="button" id="modal-cancelar" class="btn-modal-cancelar">
                    Cancelar
                </button>

                <button type="button" id="modal-confirmar" class="btn-modal-confirmar">
                    Confirmar
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
